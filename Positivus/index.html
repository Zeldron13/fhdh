<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <title>Positivus</title>
</head>

<body>
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="#" class="logщ">
        <img src="img/logo.svg" alt="Positivus">
      </a>
      <div class="nav-right">
        <nav class="nav-links">
          <a href="#">About us</a>
          <a href="#">Services</a>
          <a href="#">Use Cases</a>
          <a href="#">Pricing</a>
          <a href="#">Blog</a>
        </nav>
        <button class="btn btn-outline">Request a quote</button>
      </div>
    </div>
  </header>
  <section class="hero">
    <div class="container hero-inner">
      <div class="hero-text">
        <h1 class="hero-title">Navigating the digital landscape for success</h1>
        <p class="hero-content">Our digital marketing agency helps businesses grow and succeed online through a range of
          services including
          SEO, PPC, social media marketing, and content creation.</p>
        <button class="btn btn-primary">Book a consultation</button>
      </div>
      <img src="img/hero.png" alt="digital marketing illustration">
    </div>
  </section>
  <section class="logos">
    <div class="container logos-inner">
      <img src="img/logo-amazon.png" alt="amazon">
      <img src="img/logo-dribbble.png" alt="dribbble">
      <img src="img/logo-hubspot.png" alt="hubspot">
      <img src="img/logo-notion.png" alt="notion">
      <img src="img/logo-netflix.png" alt="netflix">
      <img src="img/logo-zoom.png" alt="zoom">
    </div>
  </section>
</body>

</html>

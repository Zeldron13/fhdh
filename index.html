<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Портфолио — JS проекты</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      text-align: center;
      padding: 70px 20px 50px;
      background: #2c3e50;
      color: white;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    header p {
      opacity: 0.85;
    }

    .projects {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      padding: 50px 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background: white;
      width: 260px;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card h3 {
      margin-bottom: 10px;
      font-size: 18px;
    }

    .card p {
      font-size: 14px;
      color: #555;
      margin-bottom: 18px;
      min-height: 40px;
    }

    .card a {
      display: inline-block;
      padding: 8px 18px;
      background: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
    }

    .card a:hover {
      background: #2980b9;
    }

    footer {
      text-align: center;
      padding: 30px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

  <header>
    <h1>Мои проекты на JavaScript</h1>
    <p>Учусь и практикуюсь — вот что уже готово</p>
  </header>

  <section class="projects">
    <div class="card">
      <h3>To-Do List</h3>
      <p>Список задач с сохранением в localStorage</p>
      <a href="./todo-app/">Открыть</a>
    </div>

    <div class="card">
      <h3>Погода</h3>
      <p>Поиск погоды по городу через реальный API</p>
      <a href="./weather-app/">Открыть</a>
    </div>

    <div class="card">
      <h3>Лендинг</h3>
      <p>Модальное окно, валидация формы, анимация</p>
      <a href="./landing/">Открыть</a>
    </div>
  </section>

  <footer>
    GitHub: <a href="https://github.com/Zeldron13" style="color:#3498db;">Zeldron13</a>
  </footer>

</body>

</html>
